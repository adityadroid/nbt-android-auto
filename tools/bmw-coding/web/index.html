<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMW Coding</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#272b36; --fg:#e6e8ee; --dim:#9aa3b2;
    --accent:#4a90e2; --warn:#e2a24a; --good:#5bbd7a; --chg:#e2cb4a;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f6f7f9; --panel:#fff; --line:#e2e5ea; --fg:#1a1d24; --dim:#5c6472;
      --accent:#2b6cb0; --warn:#9a6a10; --good:#2f8a4e; --chg:#8a7410;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel)}
  h1{font-size:16px;margin:0 12px 0 0}
  .host{color:var(--dim);font-size:12px}
  .banner{background:color-mix(in srgb,var(--warn) 18%,transparent);border:1px solid var(--warn);
    color:var(--fg);padding:8px 12px;margin:12px 16px;border-radius:8px;font-size:13px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px}
  select,input,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);
    border-radius:7px;padding:7px 10px}
  button{background:var(--accent);border-color:var(--accent);color:#fff;cursor:pointer}
  button.ghost{background:var(--bg);color:var(--fg)}
  button:disabled{opacity:.5;cursor:not-allowed}
  label.chk{display:inline-flex;gap:6px;align-items:center;color:var(--dim);font-size:13px}
  #status{padding:0 16px;color:var(--dim);min-height:20px}
  .wrap{padding:8px 16px 40px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{position:sticky;top:0;background:var(--panel);cursor:pointer;white-space:nowrap}
  td.loc{font-family:ui-monospace,Menlo,monospace;color:var(--dim);white-space:nowrap}
  .name{color:var(--dim);font-style:italic}
  .name.known{color:var(--fg);font-style:normal}
  .pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:12px;border:1px solid var(--line)}
  .pill.cur{border-color:var(--accent);color:var(--accent)}
  .pill.chg{border-color:var(--chg);color:var(--chg)}
  .pill.def{color:var(--dim)}
  .muted{color:var(--dim)}
  code{font-family:ui-monospace,Menlo,monospace}
  .count{color:var(--dim);font-size:12px;margin-left:auto}
</style>
</head>
<body>
<header>
  <h1>BMW Coding</h1>
  <span class="host" id="carhost"></span>
</header>

<div class="banner" id="banner">
  <b>Read-only.</b> Writing coding is turned off until the signer is built and a change is verified.
  Every read saves a full backup under <code>.local/coding-backups/</code>.
  Do <b>not</b> code <code>HU_NBT</code> while the Android Auto mod is installed.
</div>

<div class="bar">
  <select id="module"></select>
  <button id="btnRead">Read from car</button>
  <span class="muted">or offline:</span>
  <input id="cafd" value="00000DED" size="10" title="decoded CAFD id">
  <button class="ghost" id="btnOffline">Load CAFD</button>
</div>

<div class="bar">
  <input id="q" placeholder="search name / location / datagroup" size="34">
  <label class="chk"><input type="checkbox" id="fCode" checked> codeable only</label>
  <label class="chk"><input type="checkbox" id="fChg"> changed from default</label>
  <label class="chk"><input type="checkbox" id="fNamed"> named only</label>
  <span class="count" id="count"></span>
</div>

<div id="status"></div>

<div class="wrap">
  <table id="tbl">
    <thead><tr>
      <th data-k="datagroup">Datagroup</th>
      <th data-k="loc">Location</th>
      <th data-k="name">Name</th>
      <th data-k="current">Current</th>
      <th data-k="default">Default</th>
      <th data-k="options">Options</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
let FEATS=[], META={}, sortK="datagroup", sortDir=1;
const $=s=>document.querySelector(s);
const hex=a=>(a||[]).map(x=>x.toString(16).padStart(2,"0").toUpperCase()).join(" ");

async function j(u){const r=await fetch(u);return r.json();}

async function init(){
  const m=await j("/api/modules");
  $("#carhost").textContent="car: "+m.host;
  $("#module").innerHTML=m.modules.map(x=>
    `<option value="${x.name}">${x.name} (${x.addr}) — ${x.note}</option>`).join("");
  $("#module").value="CAS";
}
function setStatus(t){$("#status").textContent=t;}

function load(res){
  if(res.error){setStatus("⚠ "+res.error);FEATS=[];render();return;}
  META=res; FEATS=res.features||[];
  let s=`CAFD ${res.cafd_id} v${res.version||""}`;
  if(res.module) s=res.module+" · "+s;
  if(res.backup) s+=` · backup saved: ${res.backup}`;
  if(res.source) s+=` · ${res.source} (offline, not read from car)`;
  if(res.read_datagroups) s+=` · read ${res.read_datagroups.join(", ")}`;
  setStatus(s); render();
}
async function readCar(){
  setStatus("reading "+$("#module").value+" from the car…");
  load(await j("/api/read?module="+encodeURIComponent($("#module").value)));
}
async function offline(){
  setStatus("parsing CAFD "+$("#cafd").value+"…");
  load(await j("/api/offline?cafd="+encodeURIComponent($("#cafd").value)));
}

function valLabel(v){
  const lbl=META.features&&null; // placeholder
  return hex(v);
}
function rowHtml(f){
  const labels=f.value_labels||{};
  const lab=v=>{const k=(v&&v.length?v.map(x=>x).join(","):"");return labels[String(v[0])]||hex(v);};
  const cur=f.current==null?`<span class="muted">—</span>`:
    `<span class="pill ${f.is_default?'cur':'chg'}">${lab(f.current)}</span>`;
  const def=f.default&&f.default.length?`<span class="pill def">${lab([f.default[0]&f.mask])}</span>`:`<span class="muted">—</span>`;
  const opts=(f.options||[]).map(o=>`<span class="pill">${lab(o)}</span>`).join(" ")||`<span class="muted">—</span>`;
  const nm=f.name?`<span class="name known">${f.name}</span>`:`<span class="name">(unnamed)</span>`;
  return `<tr>
    <td class="loc">${f.datagroup}</td>
    <td class="loc">b${f.start}${f.end!=f.start?"–"+f.end:""} &amp; ${f.mask.toString(16).padStart(2,"0").toUpperCase()}</td>
    <td>${nm}</td><td>${cur}</td><td>${def}</td><td>${opts}</td></tr>`;
}
function render(){
  const q=$("#q").value.trim().toLowerCase();
  const onlyCode=$("#fCode").checked, onlyChg=$("#fChg").checked, onlyNamed=$("#fNamed").checked;
  let rows=FEATS.filter(f=>{
    if(onlyCode&&!f.codeable)return false;
    if(onlyChg&&!(f.is_default===false))return false;
    if(onlyNamed&&!f.name)return false;
    if(q){const hay=(f.name+" "+f.datagroup+" "+f.key).toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
  rows.sort((a,b)=>{
    let x=a[sortK],y=b[sortK];
    if(sortK=="loc"){x=a.datagroup+a.start;y=b.datagroup+b.start;}
    x=String(x);y=String(y);return x<y?-sortDir:x>y?sortDir:0;
  });
  $("#rows").innerHTML=rows.map(rowHtml).join("");
  $("#count").textContent=rows.length+" of "+FEATS.length+" shown";
}

$("#btnRead").onclick=readCar;
$("#btnOffline").onclick=offline;
["q","fCode","fChg","fNamed"].forEach(id=>$("#"+id).addEventListener("input",render));
document.querySelectorAll("th").forEach(th=>th.onclick=()=>{
  const k=th.dataset.k; sortDir=(sortK==k)?-sortDir:1; sortK=k; render();
});
init();
</script>
</body>
</html>
